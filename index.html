<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizační pavouci – Správa železnic</title>
<style id="app-style">:root {
  --blue: #002b59;
  --orange: #ff5200;
  --gray: #737373;
  --cyan: #00a1e0;
  --blue-light: #eef2f6;
  --gray-light: #f4f4f4;
  --border: #dfe3e8;
  --white: #ffffff;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Verdana, Geneva, Tahoma, sans-serif;
  color: #1c1c1c;
  background: var(--gray-light);
}

#app-root { height: 100%; }

button, input, select, textarea { font-family: inherit; font-size: 13px; }

h1, h2, h3, h4 { color: var(--blue); font-family: Verdana, Geneva, sans-serif; margin: 0 0 8px; }
h1 { font-size: 22px; }
h2 { font-size: 17px; margin-top: 26px; }
h3 { font-size: 15px; }
h4 { font-size: 13px; margin-top: 18px; }
p { line-height: 1.5; }
.view-intro { color: var(--gray); max-width: 900px; }
.hint { color: var(--gray); font-size: 12px; }
.empty-note { color: var(--gray); font-style: italic; }

.app-shell { display: flex; flex-direction: column; height: 100%; }

.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--blue);
  color: var(--white);
  padding: 0 18px;
  height: 56px;
  flex: none;
}
.brand { font-weight: bold; font-size: 16px; display: flex; flex-direction: column; line-height: 1.1; }
.brand-sub { font-weight: normal; font-size: 11px; color: #b9c6d6; }
.topbar-search { position: relative; flex: 1; max-width: 480px; }
.topbar-search input {
  width: 100%;
  padding: 7px 10px;
  border-radius: 4px;
  border: none;
  background: rgba(255,255,255,0.92);
}
.search-results {
  position: absolute;
  top: 36px;
  left: 0;
  right: 0;
  background: var(--white);
  color: #1c1c1c;
  border-radius: 4px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  max-height: 360px;
  overflow-y: auto;
  z-index: 50;
}
.search-results.hidden { display: none; }
.search-result { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.search-result:hover { background: var(--blue-light); }
.search-result .tag { display: inline-block; min-width: 60px; color: var(--orange); font-weight: bold; font-size: 11px; margin-right: 6px; }
.search-empty { padding: 10px 12px; color: var(--gray); }

.topbar-actions { display: flex; align-items: center; gap: 10px; }
.topbar-actions input {
  padding: 6px 9px;
  border-radius: 4px;
  border: 1px solid transparent;
  width: 170px;
}

.btn {
  padding: 7px 12px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--blue);
  cursor: pointer;
  font-weight: bold;
}
.btn:hover { background: var(--blue-light); }
.btn-primary { background: var(--orange); color: var(--white); border-color: var(--orange); }
.btn-primary:hover { background: #e04a00; }
.btn-danger { color: #b3261e; border-color: #e6b3ae; }
.btn-danger:hover { background: #fbe9e7; }
.btn-icon { border: none; background: none; color: var(--gray); cursor: pointer; font-size: 13px; }
.btn-icon:hover { color: var(--orange); }

.app-body { flex: 1; display: flex; min-height: 0; }

.sidebar {
  width: 240px;
  flex: none;
  background: var(--white);
  border-right: 1px solid var(--border);
  padding: 14px 10px;
  overflow-y: auto;
}
.sidebar-section { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gray); margin: 16px 8px 6px; }
.nav-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 10px;
  margin: 2px 0;
  border: none;
  background: none;
  border-radius: 4px;
  cursor: pointer;
  color: #1c1c1c;
  font-weight: bold;
}
.nav-btn:hover { background: var(--blue-light); }
.nav-btn.active { background: var(--blue); color: var(--white); }
.nav-sub { display: block; font-weight: normal; font-size: 11px; color: var(--gray); }
.nav-btn.active .nav-sub { color: #cfe0f2; }
.nav-btn-ghost { color: var(--orange); font-weight: bold; }

.content { flex: 1; overflow-y: auto; padding: 22px 28px; min-width: 0; }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin: 14px 0; }
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.inst-card { cursor: pointer; border-top: 3px solid var(--blue); }
.inst-card:hover { box-shadow: 0 4px 14px rgba(0,43,89,0.12); }
.card-title { font-weight: bold; color: var(--blue); font-size: 16px; }
.card-sub { color: var(--gray); font-size: 12px; margin-bottom: 10px; min-height: 16px; }
.card-stats { display: flex; gap: 14px; font-size: 12px; color: #333; }
.card-stats b { color: var(--orange); font-size: 15px; display: block; }

.table-wrap { overflow-x: auto; }
.data-table { border-collapse: collapse; width: 100%; background: var(--white); font-size: 12.5px; }
.data-table th, .data-table td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; }
.data-table th { background: var(--blue); color: var(--white); }
.data-table tbody tr:nth-child(even) { background: var(--gray-light); }
.matrix-table td.has-val { font-weight: bold; color: var(--orange); }
.matrix-table td.diag { background: var(--gray-light); color: var(--gray); }
.mini-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; }
.mini-table th, .mini-table td { border-bottom: 1px solid var(--border); padding: 5px 4px; text-align: left; }

.report-section { margin-bottom: 30px; }
.report-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.report-actions { display: flex; gap: 8px; }
.reports-toolbar { margin: 10px 0 20px; }

.inline-form { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
.inline-form input, .inline-form select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; }

.topics-tree { margin-top: 14px; max-width: 640px; }
.topic-block { background: var(--white); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; }
.topic-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.topic-row:last-child { border-bottom: none; }
.topic-row-parent { font-weight: bold; color: var(--blue); background: var(--blue-light); border-radius: 6px 6px 0 0; }
.topic-row-child { padding-left: 26px; font-size: 12.5px; }
.topic-name { cursor: pointer; }
.topic-name:hover { color: var(--orange); }

/* ---- editor ---- */
.editor-layout { display: flex; flex-direction: column; height: calc(100vh - 56px - 44px); }
.editor-toolbar { padding: 8px 0 14px; }
.canvas-title { margin: 0 0 8px; }
.canvas-title-code { color: var(--gray); font-weight: normal; font-size: 14px; }
.editor-toolbar-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.editor-toolbar select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; margin-right: 6px; }
.spacer { flex: 1; }
.editor-main { flex: 1; display: flex; gap: 14px; min-height: 0; }
.canvas-host {
  flex: 1;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  min-width: 0;
  position: relative;
  cursor: grab;
}
.spider-svg { display: block; user-select: none; }
.side-panel {
  width: 340px;
  flex: none;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  overflow-y: auto;
}

.stacked-form { display: flex; flex-direction: column; gap: 10px; }
.stacked-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--gray); font-weight: bold; }
.stacked-form input, .stacked-form select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-weight: normal; color: #1c1c1c; }
.checkbox-row { flex-direction: row !important; align-items: center; gap: 6px !important; }
.checkbox-row input { width: auto; }

.rep-row { display: grid; grid-template-columns: 1fr 1fr 90px 24px; gap: 6px; margin-bottom: 6px; align-items: center; }
.rep-row input, .rep-row select { padding: 5px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; }

.topic-checklist { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; padding: 8px; }
.topic-checklist label { display: block; font-size: 12px; padding: 3px 0; }

.link-nav-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 5px;
  font-size: 12px;
  cursor: pointer;
}
.link-nav-row:hover { background: var(--blue-light); border-color: var(--blue); }
.link-nav-row .tag { display: inline-block; min-width: 60px; color: var(--orange); font-weight: bold; font-size: 11px; }

/* SVG label typography */
.frame-label, .group-id-label, .group-name-label, .group-info-label, .link-stub-label, .link-id-label, .export-title {
  font-family: Verdana, Geneva, sans-serif;
}
.frame-label { fill: var(--blue); font-weight: bold; font-size: 12px; }
.group-id-label { fill: var(--white); font-weight: bold; font-size: 10px; }
.group-name-label { fill: var(--blue); font-weight: bold; font-size: 13px; }
.group-info-label { fill: var(--gray); font-size: 10px; }
.link-stub-label { fill: var(--blue); font-size: 10px; }
.link-id-label { font-weight: bold; font-size: 10px; }
.export-title { fill: var(--blue); font-weight: bold; font-size: 20px; }
.resize-handle { fill: var(--orange); cursor: nwse-resize; }
.link-stub { cursor: pointer; }
.frame-node-ref { cursor: pointer; }
.link-end-handle { fill: var(--orange); stroke: #ffffff; stroke-width: 1.2; opacity: 0.5; transition: opacity 0.12s; }
.link-end-handle:hover { opacity: 1; }
.link-end-handle[data-axis="y"] { cursor: ns-resize; }
.link-end-handle[data-axis="x"] { cursor: ew-resize; }

/* ---- print ---- */
#print-area { display: none; }
body.printing > *:not(#print-area) { display: none !important; }
body.printing #print-area { display: block; }
#print-area h1 { color: var(--blue); }
#print-area table { border-collapse: collapse; width: 100%; }
#print-area th, #print-area td { border: 1px solid #999; padding: 5px 8px; font-size: 11px; text-align: left; }
#print-area th { background: var(--blue-light); }

@media (max-width: 900px) {
  .side-panel { width: 280px; }
  .sidebar { width: 190px; }
}
</style>

      ).join("")}
      </div>`;
    }).join("") || '<p class="empty-note">Registr t\xE9mat je zat\xEDm pr\xE1zdn\xFD.</p>';
    container.querySelectorAll("[data-del-topic]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const topicUid = btn.dataset.delTopic;
        if (!window.confirm("Smazat toto t\xE9ma? Odebere se i ze v\u0161ech skupin, kter\xE9 ho maj\xED p\u0159i\u0159azen\xE9.")) return;
        store.commit("Smaz\xE1no t\xE9ma", (data) => removeTopicCascade(data, topicUid));
      });
    });
    container.querySelectorAll("[data-edit-topic]").forEach((spanEl) => {
      spanEl.addEventListener("click", () => {
        const topicUid = spanEl.dataset.editTopic;
        const topic = store.data.topics.find((t) => t.uid === topicUid);
        const name = window.prompt("Nov\xFD n\xE1zev t\xE9matu:", topic.name);
        if (!name) return;
        store.commit(`P\u0159ejmenov\xE1no t\xE9ma na ${name}`, (data) => {
          const t = data.topics.find((tt) => tt.uid === topicUid);
          if (t) t.name = name;
        });
      });
    });
  }
  function renderReportsView(root) {
    const reports = ALL_REPORTS(store.data);
    root.innerHTML = `
    <h1>P\u0159ehledy</h1>
    <p class="view-intro">Souhrnn\xE9 pohledy nap\u0159\xED\u010D v\u0161emi institucemi appky. Libovoln\xFD p\u0159ehled lze exportovat do form\xE1tovan\xE9ho XLSX nebo do PDF.</p>
    <div class="reports-toolbar">
      <button class="btn btn-primary" id="btn-export-all">Export v\u0161ech p\u0159ehled\u016F do XLSX</button>
    </div>
    <div id="reports-body"></div>
    <h2>Skupiny a z\xE1stupci podle t\xE9matu</h2>
    <div class="inline-form">
      <select id="topic-picker">
        <option value="">\u2014 vyberte t\xE9ma \u2014</option>
        ${store.data.topics.map((t) => `<option value="${t.uid}">${escapeHtml(topicPath(store.data, t.uid))}</option>`).join("")}
      </select>
      <select id="topic-level">
        <option value="all">Nap\u0159\xED\u010D v\u0161emi \xFArovn\u011Bmi</option>
        <option value="exact">Jen dan\xE9 t\xE9ma / podt\xE9ma</option>
        <option value="category">Jen nad\u0159azen\xE9 (agregovan\u011B za podt\xE9mata)</option>
      </select>
    </div>
    <div id="topic-report-body"></div>
  `;
    root.querySelector("#btn-export-all").addEventListener("click", () => {
      exportAllReportsXlsx(reports, `pavouci-prehledy-${Date.now()}.xlsx`);
    });
    const body = root.querySelector("#reports-body");
    body.innerHTML = reports.map(
      (r) => `<section class="report-section">
        <div class="report-head">
          <h2>${escapeHtml(r.title)}</h2>
          <div class="report-actions">
            <button class="btn" data-xlsx="${r.id}">XLSX</button>
            <button class="btn" data-pdf="${r.id}">PDF</button>
          </div>
        </div>
        ${r.id === "crossMatrix" ? renderMatrix(r.matrix) : table(r)}
      </section>`
    ).join("");
    body.querySelectorAll("[data-xlsx]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const r = reports.find((rr) => rr.id === btn.dataset.xlsx);
        exportReportXlsx(r, `${slug(r.title)}.xlsx`);
      });
    });
    body.querySelectorAll("[data-pdf]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const r = reports.find((rr) => rr.id === btn.dataset.pdf);
        printReport(r);
      });
    });
    const topicPicker = root.querySelector("#topic-picker");
    const topicLevel = root.querySelector("#topic-level");
    const topicReportBody = root.querySelector("#topic-report-body");
    const renderTopicReport = () => {
      if (!topicPicker.value) {
        topicReportBody.innerHTML = "";
        return;
      }
      const r = reportGroupsByTopic(store.data, topicPicker.value, topicLevel.value);
      topicReportBody.innerHTML = `<div class="report-head"><h3>${escapeHtml(r.title)}</h3>
      <div class="report-actions"><button class="btn" id="btn-topic-xlsx">XLSX</button><button class="btn" id="btn-topic-pdf">PDF</button></div>
    </div>${table(r)}`;
      topicReportBody.querySelector("#btn-topic-xlsx").addEventListener("click", () => exportReportXlsx(r, `${slug(r.title)}.xlsx`));
      topicReportBody.querySelector("#btn-topic-pdf").addEventListener("click", () => printReport(r));
    };
    topicPicker.addEventListener("change", renderTopicReport);
    topicLevel.addEventListener("change", renderTopicReport);
  }
  function renderMatrix(matrix) {
    if (!matrix.institutions.length) return '<p class="empty-note">\u017D\xE1dn\xE9 instituce.</p>';
    return `<div class="table-wrap"><table class="data-table matrix-table"><thead><tr><th></th>${matrix.institutions.map((c) => `<th>${escapeHtml(c)}</th>`).join("")}</tr></thead><tbody>${matrix.institutions.map(
      (rowCode, i) => `<tr><th>${escapeHtml(rowCode)}</th>${matrix.counts[i].map((v, j) => `<td class="${i === j ? "diag" : v ? "has-val" : ""}">${i === j ? "\u2014" : v}</td>`).join("")}</tr>`
    ).join("")}</tbody></table></div>`;
  }
  function slug(str) {
    return str.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }
  function renderHistoryView(root) {
    const entries = [...store.data.history].reverse();
    root.innerHTML = `
    <h1>Historie verz\xED</h1>
    <p class="view-intro">Appka si intern\u011B ukl\xE1d\xE1 historii zm\u011Bn (log verz\xED) p\u0159\xEDmo v datov\xE9 struktu\u0159e, nez\xE1visle na verzov\xE1n\xED SharePoint knihovny. Uchov\xE1v\xE1 se posledn\xEDch ${MAX_HISTORY} verz\xED. Kdykoli se lze vr\xE1tit k p\u0159edchoz\xED verzi.</p>
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>\u010Cas</th><th>Editor</th><th>Popis zm\u011Bny</th><th></th></tr></thead>
      <tbody>${entries.map(
      (h) => `<tr><td>${escapeHtml(formatTs(h.ts))}</td><td>${escapeHtml(h.editor || "(nevypln\u011Bno)")}</td><td>${escapeHtml(h.summary)}</td>
          <td><button class="btn" data-rollback="${h.uid}">Obnovit tuto verzi</button></td></tr>`
    ).join("")}</tbody>
    </table></div>
  `;
    root.querySelectorAll("[data-rollback]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!window.confirm("Obnovit appku do stavu t\xE9to verze? Aktu\xE1ln\xED stav z\u016Fstane tak\xE9 zachov\xE1n v historii.")) return;
        store.rollbackTo(btn.dataset.rollback);
        navigate({ view: "dashboard" });
      });
    });
  }

  // src/seed.js
  var STARTER_INSTITUTIONS = [
    ["CER", "Community of European Railway and Infrastructure Companies"],
    ["PRIME", "Platform of Rail Infrastructure Managers in Europe"],
    ["SERAF", "Single European Railway Area Forum"],
    ["RFC", "Rail Freight Corridors"],
    ["EUG", "European Users Group"],
    ["EULYNX", "EULYNX"],
    ["UIC", "International Union of Railways"],
    ["RISC", "Rail Interoperability and Safety Committee"],
    ["RNE", "RailNetEurope"],
    ["ERA", "European Union Agency for Railways"],
    ["GRB", "Group of Representative Bodies"],
    ["EC", "European Commission"]
  ];
  function makeSeedData() {
    const data = makeEmptyData();
    data.institutions = STARTER_INSTITUTIONS.map(([code, name]) => makeInstitution(code, name));
    return data;
  }

  // src/main.js
  var store2 = Store.bootstrap(makeSeedData);
  mountApp(store2);
})();
</script>
</body>
